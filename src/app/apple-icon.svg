<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <defs>
    <radialGradient id="appleBg" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#121a3e"/>
      <stop offset="60%" stop-color="#080c1f"/>
      <stop offset="100%" stop-color="#050611"/>
    </radialGradient>
    <linearGradient id="appleF" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#e2e8f8"/>
      <stop offset="100%" stop-color="#72e5ff"/>
    </linearGradient>
    <linearGradient id="appleOrbit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#72e5ff"/>
      <stop offset="50%" stop-color="#52d9ff"/>
      <stop offset="100%" stop-color="#9b8cff"/>
    </linearGradient>
    <filter id="appleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="180" height="180" rx="36" fill="url(#appleBg)" stroke="#223061" stroke-width="3"/>
  <circle cx="90" cy="90" r="74" fill="none" stroke="rgba(155, 140, 255, 0.16)" stroke-width="2" stroke-dasharray="8 8"/>

  <g transform="rotate(-26 90 90)">
    <path d="M 160 90 A 70 26 0 0 0 20 90" fill="none" stroke="url(#appleOrbit)" stroke-width="7" stroke-dasharray="65 18 100 18"/>
  </g>

  <!-- Letterform F -->
  <rect x="56" y="42" width="19" height="96" rx="5" fill="url(#appleF)"/>
  <rect x="56" y="42" width="68" height="18" rx="5" fill="url(#appleF)"/>
  <rect x="56" y="81" width="45" height="15" rx="4" fill="url(#appleF)"/>

  <!-- Fore Orbit Arc -->
  <g transform="rotate(-26 90 90)">
    <path d="M 20 90 A 70 26 0 0 0 160 90" fill="none" stroke="url(#appleOrbit)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="158" cy="89" r="8" fill="#72e5ff" filter="url(#appleGlow)"/>
    <circle cx="158" cy="89" r="3.5" fill="#ffffff"/>
  </g>

  <!-- Star Glint -->
  <polygon points="126,36 130,43 137,44 130,46 126,53 122,46 115,44 122,43" fill="#ffffff"/>
</svg>
